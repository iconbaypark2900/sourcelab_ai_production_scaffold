[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcelab-ai"
version = "1.0.2"
description = "Source-grounded adaptive technical lab generator scaffold."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
ui = ["streamlit>=1.30"]
ingest = ["pypdf>=4.0", "beautifulsoup4>=4.12", "requests>=2.31"]
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
models = ["httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
sourcelab = "sourcelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100

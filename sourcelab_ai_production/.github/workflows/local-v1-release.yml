name: Local v1 Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,api,ui,ingest,retrieval,models]"

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Run Python tests
        run: pytest -q

      - name: Build frontend
        run: cd apps/web && npm run build

      - name: Run frontend tests
        run: cd apps/web && npm run test

      - name: Init local environment
        run: sourcelab init-local

      - name: Run local demo
        run: sourcelab local-demo

      - name: Strict release verification
        run: sourcelab verify-release --strict

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,api,ui,ingest,retrieval,models]"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          if [ -n "$PREV_TAG" ]; then
            sourcelab release changelog --from "$PREV_TAG" --to "$CURRENT_TAG"
          fi

      - name: Build release bundle
        run: sourcelab release bundle

      - name: Generate release checksums
        run: sourcelab release checksums

      - name: Export SBOM
        run: sourcelab release sbom

      - name: Export attestation
        run: sourcelab release attest

      - name: Release signing dry-run
        run: sourcelab release sign --mode dry-run

      - name: Verify signature status
        run: sourcelab release verify-signature

      - name: Publish dry-run plan
        run: sourcelab release publish --dry-run

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sourcelab-local-v1-release
          path: artifacts/release/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/sourcelab_local_v1_ga_bundle/*
            artifacts/release/changelog_*.md
          body_path: artifacts/release/local_v1_release_report.md
          draft: false
          prerelease: false
